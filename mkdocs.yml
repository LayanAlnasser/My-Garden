site_name: "Layan's Digital Garden"
site_url: "https://layanalnasser.github.io/My-Garden/"
copyright: ©️ 2026 | Layan Abdualaziz Alnasser · All rights reserved

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.tabs.sticky       
    - navigation.sections
    - navigation.indexes     
    - navigation.top
    - navigation.path
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - toc.follow 
  palette:
    - scheme: default
      primary: red
      accent: red
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      primary: red
      accent: red
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  icon:
    logo: material/robot-outline
  font:
    text: Space Grotesk
    code: JetBrains Mono

nav:
  - Home: index.md

  - Academics:
      - Overview: academics/index.md
      - Notes & Learning: academics/notes.md
      - Resources: academics/resources.md

  - Career Development:
      - About Me: career/about.md
      - Resume / CV: career/cv.md
      - Projects: career/projects.md
      - Activities & Workshops: career/activities.md

  - Links: links.md

markdown_extensions:
  - admonition
  - toc:
      permalink: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.superfences
  - pymdownx.inlinehilite
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.magiclink
  - footnotes
  - def_list
  - tables
  - attr_list

plugins:
  - search

extra_css:
  - styles/extra.css

extra_javascript:
  - javascripts/cta-footer.js
